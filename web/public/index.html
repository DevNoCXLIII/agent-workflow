<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>schwi / swarm controller</title>
  <style>
    :root {
      --bg: #09090b;
      --bg-surface: #121215;
      --bg-surface-elevated: #18181b;
      --bg-surface-hover: #222226;
      --border: #27272a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.3);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #ffffff;
      --accent-fg: #09090b;
      --status-working: #60a5fa;
      --status-review: #f59e0b;
      --status-staged: #71717a;
      --status-done: #34d399;
      --status-error: #ef4444;
      --diff-add-bg: rgba(34, 197, 94, 0.1);
      --diff-add-text: #4ade80;
      --diff-remove-bg: rgba(239, 68, 68, 0.1);
      --diff-remove-text: #f87171;
      --diff-header-bg: rgba(255, 255, 255, 0.04);
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .brand-name {
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand-sep {
      color: var(--text-dim);
    }

    .brand-sub {
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot-pulse {
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Main Container */
    .app-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn {
      background: var(--bg-surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s ease;
      outline: none;
    }

    .btn:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-focus);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #e4e4e7;
      border-color: #e4e4e7;
    }

    .btn-danger {
      background: transparent;
      color: var(--diff-remove-text);
      border-color: transparent;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-sm {
      padding: 3px 8px;
      font-size: 11px;
    }

    .worktree-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wt-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wt-item:hover {
      background: var(--bg-surface-elevated);
    }

    .wt-item.active {
      background: var(--bg-surface-elevated);
      border-color: var(--border-focus);
    }

    .wt-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wt-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .wt-status-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-tag-WORKING { color: var(--status-working); }
    .status-tag-READY_FOR_REVIEW { color: var(--status-review); }
    .status-tag-STAGED { color: var(--status-staged); }
    .status-tag-CLEANED_UP { color: var(--text-dim); }
    .status-tag-BLOCKED { color: var(--status-error); }

    .wt-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 6px;
    }

    /* Main Panel */
    .main-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg);
    }

    /* Review Notice Bar (VPS & Local) */
    .review-bar {
      background: rgba(245, 158, 11, 0.06);
      border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .review-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--status-review);
    }

    .cmd-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .cmd-chip:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* Tabs */
    .nav-tabs {
      height: 40px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-shrink: 0;
    }

    .tab-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 11px 0;
      border-bottom: 2px solid transparent;
      transition: color 0.12s ease;
    }

    .tab-link:hover {
      color: var(--text);
    }

    .tab-link.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .editor-pane {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    .terminal-pane {
      width: 100%;
      height: 100%;
      background: #08080a;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #a1a1aa;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diff-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
    }

    .diff-line {
      padding: 1px 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diff-add {
      background-color: var(--diff-add-bg);
      color: var(--diff-add-text);
    }

    .diff-remove {
      background-color: var(--diff-remove-bg);
      color: var(--diff-remove-text);
    }

    .diff-header {
      background-color: var(--diff-header-bg);
      color: var(--text-dim);
      font-weight: 600;
      margin-top: 10px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 6px;
    }

    .diff-chunk {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    /* Action Footer */
    footer.action-bar {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-field {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.12s ease;
    }

    .input-field:focus {
      border-color: var(--border-focus);
    }

    .select-field {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 8px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    /* Minimal Command Modal (Linear / Raycast Style) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-window {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 580px;
      max-width: 92vw;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .spec-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .spec-textarea:focus {
      border-color: var(--border-focus);
    }

    .analysis-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .modal-footer {
      padding: 12px 16px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-name">schwi</span>
      <span class="brand-sep">/</span>
      <span class="brand-sub">swarm controller</span>
    </div>
    <div class="header-meta">
      <div id="vps-badge" class="badge" style="cursor: pointer;" title="Toggle VPS Mode">
        <span class="status-dot dot-pulse" style="color: var(--status-working);"></span>
        <span id="vps-label">VPS Mode</span>
      </div>
      <div id="net-badge" class="badge">
        <span id="net-label">Localhost: 3456</span>
      </div>
      <div class="badge">
        <span>active workers: <b id="active-count">0</b></span>
      </div>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Worktrees</span>
        <button class="btn btn-sm" onclick="openCreateModal()">+ New Task</button>
      </div>
      <div class="worktree-list" id="wt-list">
        <div style="padding: 16px; text-align: center; color: var(--text-dim);">
          No worktrees active.
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-panel" id="main-panel">
      <!-- Review Banner -->
      <div id="review-bar" class="review-bar" style="display: none;">
        <div class="review-text">
          <span class="status-dot" style="color: var(--status-review);"></span>
          <span>Task completed. Verify on branch:</span>
          <span class="cmd-chip" id="banner-cmd" onclick="copyBannerCmd()">git fetch origin && git checkout feat/...</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-sm btn-primary" onclick="triggerIntegrate()">Integrate</button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs">
        <button class="tab-link active" onclick="switchTab('spec')">Task Spec</button>
        <button class="tab-link" onclick="switchTab('terminal')">Worker Output</button>
        <button class="tab-link" onclick="switchTab('diff')">Git Diff</button>
        <div style="margin-left: auto;" id="tab-actions">
          <button class="btn btn-sm" id="btn-save-spec" onclick="saveSpec()">Save Spec</button>
        </div>
      </nav>

      <!-- Tab Content Area -->
      <div class="content-area">
        <!-- Spec Tab -->
        <textarea id="tab-spec" class="editor-pane" placeholder="Task specification..."></textarea>

        <!-- Terminal Tab -->
        <div id="tab-terminal" class="terminal-pane" style="display: none;"></div>

        <!-- Diff Tab -->
        <div id="tab-diff" class="diff-container" style="display: none;"></div>
      </div>

      <!-- Action Footer -->
      <footer class="action-bar" id="action-bar">
        <!-- Staged State Controls -->
        <div id="spawn-controls" style="display: flex; gap: 8px; width: 100%; align-items: center;">
          <select id="agent-select" class="select-field">
            <option value="kilo">Kilo (Localized)</option>
            <option value="agy">Antigravity (Architecture)</option>
          </select>
          <input type="text" id="spawn-prompt" class="input-field" placeholder="Execution instructions for agent..." value="Execute task in .schwi-task.md and run validation tests">
          <button class="btn btn-primary" onclick="triggerSpawn()">Spawn Worker</button>
        </div>

        <!-- Review State Controls -->
        <div id="prompt-controls" style="display: none; gap: 8px; width: 100%; align-items: center;">
          <input type="text" id="revision-prompt" class="input-field" placeholder="Provide revision feedback or adjustments...">
          <button class="btn" onclick="triggerPrompt()">Send Feedback</button>
          <button class="btn btn-danger" onclick="triggerDiscard()">Discard</button>
          <button class="btn btn-primary" onclick="triggerIntegrate()">Integrate</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- Command Modal: Requirement Discovery -->
  <div class="modal-backdrop" id="create-modal">
    <div class="modal-window">
      <!-- Step 1: Prompt Input -->
      <div id="modal-step-1">
        <div class="modal-header">
          <h3>Create Swarm Task</h3>
          <button class="btn btn-sm" onclick="closeCreateModal()">esc</button>
        </div>
        <div class="modal-body">
          <label style="font-size: 11px; color: var(--text-muted);">What do you want to build or modify?</label>
          <textarea id="modal-prompt" class="spec-textarea" style="height: 120px;" placeholder="e.g. Implement Google OAuth2 authentication callback in api/auth.py, store sessions in Redis, and add unit tests..."></textarea>
        </div>
        <div class="modal-footer" style="justify-content: flex-end; gap: 8px;">
          <button class="btn btn-sm" onclick="closeCreateModal()">Cancel</button>
          <button class="btn btn-sm btn-primary" id="btn-analyze" onclick="analyzeAndProceed()">Analyze & Generate Spec</button>
        </div>
      </div>

      <!-- Step 2: Spec Confirmation -->
      <div id="modal-step-2" style="display: none;">
        <div class="modal-header">
          <h3>Task Specification & Routing</h3>
          <span id="modal-complexity-tag" class="badge">Antigravity</span>
        </div>
        <div class="modal-body">
          <div class="analysis-card">
            <span id="modal-analysis-reason" style="color: var(--text-muted); font-size: 11px;"></span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div>
              <label style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Worktree</label>
              <input type="text" id="modal-name" class="input-field" style="width: 100%; margin-top: 4px;">
            </div>
            <div>
              <label style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Branch</label>
              <input type="text" id="modal-branch" class="input-field" style="width: 100%; margin-top: 4px;">
            </div>
          </div>

          <div>
            <label style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Specification (.schwi-task.md)</label>
            <textarea id="modal-spec" class="spec-textarea" style="height: 160px; margin-top: 4px;"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-sm" onclick="backToStep1()">Back</button>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-sm" onclick="closeCreateModal()">Cancel</button>
            <button class="btn btn-sm btn-primary" id="btn-create-wt" onclick="submitCreateWorktree()">Create Worktree</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let registry = {};
    let isVps = false;
    let currentWt = null;
    let currentTab = 'spec';

    function connectEvents() {
      const evtSource = new EventSource('/api/events');
      evtSource.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'init' || msg.type === 'registry') {
            registry = msg.data || msg.registry || {};
            isVps = msg.is_vps ?? false;
            renderAll();
          } else if (msg.type === 'log') {
            appendLog(msg.data.text);
          }
        } catch (err) {}
      };
      evtSource.onerror = () => setTimeout(connectEvents, 3000);
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        registry = data.registry || {};
        isVps = data.is_vps;
        window.__tailscale_ip = data.tailscale_ip;
        renderAll();
      } catch (err) {}
    }

    function renderAll() {
      // Header badges
      const vpsLabel = document.getElementById('vps-label');
      const netLabel = document.getElementById('net-label');
      
      if (isVps) {
        vpsLabel.textContent = 'VPS Mode';
        netLabel.textContent = window.__tailscale_ip ? `Tailscale: ${window.__tailscale_ip}` : 'Tailscale';
      } else {
        vpsLabel.textContent = 'Local Mode';
        netLabel.textContent = 'Localhost: 3456';
      }

      // Active count
      let active = 0;
      Object.values(registry).forEach(item => {
        if (item.status === 'WORKING') active++;
      });
      document.getElementById('active-count').textContent = active;

      // Worktree List
      const listEl = document.getElementById('wt-list');
      const keys = Object.keys(registry);

      if (keys.length === 0) {
        listEl.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-dim);">No worktrees registered.</div>';
        return;
      }

      let html = '';
      keys.forEach(k => {
        const item = registry[k];
        const activeClass = k === currentWt ? 'active' : '';
        const status = item.status || 'STAGED';
        html += `
          <div class="wt-item ${activeClass}" onclick="selectWorktree('${k}')">
            <div class="wt-item-header">
              <span class="wt-name">${k}</span>
              <span class="wt-status-tag status-tag-${status}">
                <span class="status-dot"></span>
                <span>${status.toLowerCase().replace(/_/g, ' ')}</span>
              </span>
            </div>
            <div class="wt-meta">
              <span>${item.branch || '-'}</span>
              ${item.agent ? `<span>· ${item.agent}</span>` : ''}
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;

      if (!currentWt && keys.length > 0) {
        selectWorktree(keys[0]);
      } else if (currentWt) {
        updateMainPanel();
      }
    }

    async function selectWorktree(name) {
      currentWt = name;
      renderAll();
      if (currentTab === 'spec') await loadSpec();
      if (currentTab === 'terminal') await loadOutput();
      if (currentTab === 'diff') await loadDiff();
    }

    function updateMainPanel() {
      if (!currentWt || !registry[currentWt]) return;
      const wt = registry[currentWt];
      const isReview = wt.status === 'READY_FOR_REVIEW';

      const reviewBar = document.getElementById('review-bar');
      if (isReview) {
        reviewBar.style.display = 'flex';
        document.getElementById('banner-cmd').textContent = isVps
          ? `git fetch origin && git checkout ${wt.branch}`
          : `git checkout ${wt.branch}`;
      } else {
        reviewBar.style.display = 'none';
      }

      const spawnControls = document.getElementById('spawn-controls');
      const promptControls = document.getElementById('prompt-controls');

      if (wt.status === 'STAGED') {
        spawnControls.style.display = 'flex';
        promptControls.style.display = 'none';
      } else {
        spawnControls.style.display = 'none';
        promptControls.style.display = 'flex';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-link').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && tab === 'spec') || (i === 1 && tab === 'terminal') || (i === 2 && tab === 'diff'));
      });
      document.getElementById('tab-spec').style.display = tab === 'spec' ? 'block' : 'none';
      document.getElementById('tab-terminal').style.display = tab === 'terminal' ? 'block' : 'none';
      document.getElementById('tab-diff').style.display = tab === 'diff' ? 'block' : 'none';
      document.getElementById('btn-save-spec').style.display = tab === 'spec' ? 'inline-flex' : 'none';

      if (tab === 'spec') loadSpec();
      if (tab === 'terminal') loadOutput();
      if (tab === 'diff') loadDiff();
    }

    async function loadSpec() {
      if (!currentWt) return;
      try {
        const res = await fetch(`/api/worktrees/${currentWt}/spec`);
        const data = await res.json();
        document.getElementById('tab-spec').value = data.spec || '';
      } catch (err) {}
    }

    async function saveSpec() {
      if (!currentWt) return;
      const spec = document.getElementById('tab-spec').value;
      await fetch(`/api/worktrees/${currentWt}/spec`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spec }),
      });
      const btn = document.getElementById('btn-save-spec');
      btn.textContent = 'Saved';
      setTimeout(() => btn.textContent = 'Save Spec', 1500);
    }

    async function loadDiff() {
      if (!currentWt) return;
      const diffContainer = document.getElementById('tab-diff');
      try {
        const res = await fetch(`/api/worktrees/${currentWt}/diff`);
        const data = await res.json();
        renderDiff(data.diff || '');
      } catch (err) {
        diffContainer.textContent = 'Failed to load diff.';
      }
    }

    function renderDiff(rawDiff) {
      const container = document.getElementById('tab-diff');
      if (!rawDiff || !rawDiff.trim()) {
        container.innerHTML = '<div style="color: var(--text-dim); padding: 10px 0;">No working changes detected against base branch.</div>';
        return;
      }

      const lines = rawDiff.split('\n');
      let html = '';
      lines.forEach(line => {
        const escaped = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        if (line.startsWith('diff --git') || line.startsWith('index ')) {
          html += `<div class="diff-line diff-header">${escaped}</div>`;
        } else if (line.startsWith('@@')) {
          html += `<div class="diff-line diff-chunk">${escaped}</div>`;
        } else if (line.startsWith('+') && !line.startsWith('+++')) {
          html += `<div class="diff-line diff-add">${escaped}</div>`;
        } else if (line.startsWith('-') && !line.startsWith('---')) {
          html += `<div class="diff-line diff-remove">${escaped}</div>`;
        } else {
          html += `<div class="diff-line">${escaped}</div>`;
        }
      });
      container.innerHTML = html;
    }

    async function loadOutput() {
      if (!currentWt) return;
      const term = document.getElementById('tab-terminal');
      try {
        const res = await fetch(`/api/worktrees/${currentWt}/output`);
        const data = await res.json();
        term.textContent = data.output || 'No output recorded.';
      } catch (err) {
        term.textContent = 'Worker process is currently inactive.';
      }
    }

    function appendLog(text) {
      const term = document.getElementById('tab-terminal');
      term.textContent += text;
      term.scrollTop = term.scrollHeight;
    }

    function copyBannerCmd() {
      const text = document.getElementById('banner-cmd').textContent;
      navigator.clipboard.writeText(text);
      const original = text;
      document.getElementById('banner-cmd').textContent = 'copied to clipboard';
      setTimeout(() => document.getElementById('banner-cmd').textContent = original, 1500);
    }

    async function triggerSpawn() {
      if (!currentWt) return;
      const agent = document.getElementById('agent-select').value;
      const prompt = document.getElementById('spawn-prompt').value;
      await fetch(`/api/worktrees/${currentWt}/spawn`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agent, prompt }),
      });
      switchTab('terminal');
    }

    async function triggerPrompt() {
      if (!currentWt) return;
      const prompt = document.getElementById('revision-prompt').value;
      if (!prompt) return;
      await fetch(`/api/worktrees/${currentWt}/prompt`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });
      document.getElementById('revision-prompt').value = '';
      switchTab('terminal');
    }

    async function triggerIntegrate() {
      if (!currentWt) return;
      if (!confirm(`Merge ${currentWt} into main and clean up worktree?`)) return;
      await fetch(`/api/worktrees/${currentWt}/integrate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ merge_to: 'main' }),
      });
    }

    async function triggerDiscard() {
      if (!currentWt) return;
      if (!confirm(`Discard worktree ${currentWt}?`)) return;
      await fetch(`/api/worktrees/${currentWt}/cleanup`, { method: 'POST' });
    }

    // Toggle VPS Mode
    document.getElementById('vps-badge').onclick = async () => {
      const next = !isVps;
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_vps: next }),
      });
      isVps = next;
      renderAll();
    };

    // Modal
    function openCreateModal() {
      document.getElementById('create-modal').style.display = 'flex';
      backToStep1();
      document.getElementById('modal-prompt').value = '';
      setTimeout(() => document.getElementById('modal-prompt').focus(), 50);
    }

    function closeCreateModal() {
      document.getElementById('create-modal').style.display = 'none';
    }

    function backToStep1() {
      document.getElementById('modal-step-1').style.display = 'block';
      document.getElementById('modal-step-2').style.display = 'none';
      const btn = document.getElementById('btn-analyze');
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Analyze & Generate Spec';
      }
    }

    async function analyzeAndProceed() {
      const prompt = document.getElementById('modal-prompt').value.trim();
      if (!prompt) return alert('Please enter a description for the task.');

      const btn = document.getElementById('btn-analyze');
      btn.disabled = true;
      btn.textContent = 'Analyzing requirements...';

      try {
        const res = await fetch('/api/analyze-task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const a = data.analysis;
        document.getElementById('modal-name').value = a.name;
        document.getElementById('modal-branch').value = a.branch;
        document.getElementById('modal-spec').value = a.spec;
        document.getElementById('modal-analysis-reason').textContent = a.reason;
        document.getElementById('modal-complexity-tag').textContent = a.agent === 'agy' ? 'Antigravity (Heavy)' : 'Kilo (Fast)';

        document.getElementById('modal-step-1').style.display = 'none';
        document.getElementById('modal-step-2').style.display = 'block';
      } catch (err) {
        alert('Analysis error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Analyze & Generate Spec';
      }
    }

    async function submitCreateWorktree() {
      const name = document.getElementById('modal-name').value.trim();
      const branch = document.getElementById('modal-branch').value.trim();
      const spec = document.getElementById('modal-spec').value.trim();
      if (!name || !branch) return alert('Name and branch are required');

      const btn = document.getElementById('btn-create-wt');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const res = await fetch('/api/worktrees/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, branch, spec }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        closeCreateModal();
        currentWt = name;
        renderAll();
      } catch (err) {
        alert('Failed to create worktree: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Worktree';
      }
    }

    // Keyboard Shortcuts (esc to close modal)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCreateModal();
    });

    // Init
    loadStatus();
    connectEvents();
  </script>
</body>
</html>
